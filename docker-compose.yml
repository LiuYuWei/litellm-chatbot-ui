# Coolify 部署用 docker-compose
# ─────────────────────────────────────────────────────────────
# 與本機版(docker-compose.local.yaml)的差異:
#   1. 不掛 .env、不開 ports —— 所有設定改由 Coolify UI 的環境變數頁注入
#      (下方列出的 bare 變數會出現在該頁供填寫)
#   2. 不用 SERVICE_FQDN_* magic 變數 —— 對外網域改在 Coolify UI 的
#      Domains 設定,proxy 目標埠則由本檔的 expose 提供(說明見下)
#   3. 健康檢查沿用 Dockerfile 內建的 HEALTHCHECK,不在此重複定義
#
# 網域與埠的分工(踩過坑,務必照這樣設):
#   * 網域 —— 在 Coolify 該服務的 Domains 對話框填,例如
#              https://litellm-chatbot-tcb.example.com
#   * 埠   —— 由本檔的 expose 決定。Coolify 以 compose 檔為唯一真實來源,
#              Domains 對話框的 Port 欄位只能從 compose 宣告過的埠去選,
#              不能憑空填。compose 若沒有 expose(也沒有 ports),該欄位會是
#              空的且無法編輯,Traefik 就只有路由、不知道要連哪個埠,結果是
#              網域回 502(不是 404 —— 404 代表連路由都沒有,是另一種問題)。
#
#   不要改用 ports: 來宣告。那會把服務綁上主機埠、繞過 Coolify 的 proxy。
#
#   也可以改用 SERVICE_FQDN_<識別名>_8000 magic 變數讓 Coolify 自動配網域,
#   但前提是該實例的 Wildcard Domain 在 DNS 上真的存在;若不存在,自動配出來
#   的是死網域,而且會和 UI 手動設的網域變成兩個互不同步的來源。
#
# 部署前請在 Coolify 環境變數頁填入:
#   LLM_PROVIDERS   多來源設定,單行 JSON 陣列。直接貼 JSON 本身,
#                   不要再自行加上外層引號。例如:
#                   [{"id":"ace2","label":"APMIC ACE-2","base_url":"https://...","api_key":"sk-..."}]
#                   只接一個來源時,可改用下方註解掉的 LITELLM_* 三個變數。
#   DEFAULT_MODEL   多來源時必須寫成「來源/模型」,例如 ace2/ACE-2-2602
#   AUTH_USERS      登入帳密,格式 帳號:密碼,多組以逗號分隔
#   JWT_SECRET      請用 make secret 產生,切勿沿用範例值
#
# 對話紀錄只存在使用者瀏覽器的 localStorage,故本服務不需要任何 volume。

services:
  chatbot-ui:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      # ---- 模型來源 ----
      - LLM_PROVIDERS
      # 只有單一來源時,改用下面三個(並把 LLM_PROVIDERS 留空):
      #- LITELLM_BASE_URL
      #- LITELLM_API_KEY
      #- LITELLM_TIMEOUT

      # ---- 模型 ----
      - DEFAULT_MODEL
      - ALLOWED_MODELS
      # 全域預設 temperature；各來源可在 LLM_PROVIDERS 內自行覆寫
      - DEFAULT_TEMPERATURE

      # ---- 登入 ----
      - AUTH_USERS
      - JWT_SECRET
      - JWT_EXPIRE_MINUTES

      # ---- 伺服器 ----
      - CORS_ORIGINS
      - LOG_LEVEL
    restart: unless-stopped
